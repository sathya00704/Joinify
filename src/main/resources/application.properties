spring.application.name=Joinify

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/event_management_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Jackson JSON configuration
spring.jackson.serialization.write-enums-using-to-string=true
spring.jackson.deserialization.read-enums-using-to-string=true
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.fail-on-self-references=false
spring.jpa.open-in-view=false

# Handle lazy loading in JSON serialization
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Add JVM arguments for module access
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Ensure consistent date format
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Loads local secrets if the file exists (ignored by Git). On a server, env vars are used instead.
spring.config.import=optional:classpath:application-secrets.properties

# Browser origins allowed to call the API (comma-separated). On a server, set APP_CORS_ALLOWED_ORIGINS instead.
app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

# Automatic 24-hour reminder job (Spring cron: sec min hour day month weekday)
app.reminders.cron=0 */15 * * * *